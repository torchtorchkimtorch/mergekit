models:
  - model: psmathur/orca_mini_v3_13b
    parameters:
      density: 0.2 # density (delta가 top 몇 % 까지인 parameter를 살릴 것인가) # 논문에서는 경험적으로 0.2를 제안
      weight: 1.0
  - model: garage-bAInd/Platypus2-13B
    parameters:
      density: 0.2
      weight: 1 # weight (가중 평균할 때 가중치) -> 어떤 값으로 해야하나.. 
  - model: WizardLM/WizardMath-13B-V1.0
    parameters:
      density: 0.2
      weight: 1
merge_method: dare_ties
base_model: TheBloke/Llama-2-13B-fp16
parameters:
  normalize: true
  int8_mask: true
  rescale: true  # DARE rescale parameter (default: true)
dtype: bfloat16
